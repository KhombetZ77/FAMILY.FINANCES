<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAMILY FINANCES</title>
<style>
:root{
  --green:#173b31; --green2:#234f41; --gold:#b28a4a; --gold2:#d8bc83;
  --cream:#f5f0e4; --paper:#fbf8ef; --ink:#263c35; --muted:#766f63;
  --danger:#9b3b32; --shadow:0 16px 40px rgba(48,39,25,.18);
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(185,151,91,.12) 0 2px,transparent 3px),
    radial-gradient(circle at 90% 80%,rgba(185,151,91,.10) 0 2px,transparent 3px),
    linear-gradient(135deg,#eee6d5,#faf7ed 48%,#e8dfcd);
  min-height:100vh;
}
body:before{
  content:"";position:fixed;inset:10px;pointer-events:none;border:2px solid rgba(23,59,49,.65);
  box-shadow:inset 0 0 0 5px rgba(178,138,74,.32),inset 0 0 0 8px rgba(23,59,49,.18);
  border-radius:10px;z-index:-1;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app-shell{min-height:100vh;padding:24px 20px 40px}
.main-header{
  max-width:1220px;margin:0 auto 20px;min-height:88px;padding:10px 18px;
  display:flex;align-items:center;gap:18px;background:rgba(250,247,238,.92);
  border:1px solid var(--gold);border-radius:18px;box-shadow:var(--shadow);
  position:sticky;top:12px;z-index:20;backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:250px}
.brand img{width:66px;height:66px;max-width:100%;object-fit:contain;object-position:center;display:block;overflow:visible;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.brand-title{font-size:22px;letter-spacing:1.5px;font-weight:bold;color:var(--green)}
.brand-role{font-family:Arial,sans-serif;font-size:11px;letter-spacing:1.2px;color:var(--gold);margin-top:3px}
.nav{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.nav button{
  border:1px solid transparent;background:transparent;color:var(--green);padding:11px 15px;
  border-radius:10px;font-family:Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:.7px;
}
.nav button.active,.nav button:hover{background:var(--green);color:#f8f0dc;border-color:var(--gold);box-shadow:0 5px 12px rgba(23,59,49,.18)}
.user-menu{display:flex;align-items:center;gap:8px;margin-left:5px}

.container{max-width:1220px;margin:auto}
.paper{
  background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(245,240,228,.96));
  border:1px solid rgba(178,138,74,.8);border-radius:20px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.paper:after{
  content:"";position:absolute;inset:8px;border:1px solid rgba(23,59,49,.16);border-radius:15px;pointer-events:none;
}
.page-title{padding:28px 30px 18px;text-align:center}
.page-title h1{margin:0;color:var(--green);font-size:30px;letter-spacing:2px}
.page-title p{margin:7px 0 0;color:var(--muted);font-family:Arial,sans-serif;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 26px 24px}
.stat{
  padding:20px;border:1px solid var(--gold);border-radius:15px;background:rgba(255,252,244,.8);
  box-shadow:0 7px 18px rgba(70,55,30,.1)
}
.stat-label{font-family:Arial,sans-serif;font-size:11px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.stat-value{font-size:29px;color:var(--green);font-weight:bold;margin-top:9px}
.stat-value.enter{color:#2f6c4e}.stat-value.exit{color:#93443a}
.enter-period{margin-top:10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.enter-period button{border:1px solid var(--gold);background:#f4eddf;color:var(--green);padding:5px 8px;border-radius:7px;font-family:Arial,sans-serif;font-size:9px;font-weight:700;letter-spacing:.3px}
.enter-period button.active{background:var(--green);color:#fff4df}
.enter-period-label{font-family:Arial,sans-serif;font-size:9px;color:var(--muted);margin-left:2px}
.section{margin:0 26px 26px;border:1px solid rgba(178,138,74,.72);border-radius:16px;background:rgba(255,253,247,.72);overflow:hidden}
.section-head{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(178,138,74,.45);gap:12px}
.section-head h2{margin:0;color:var(--green);font-size:18px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.segment button{
  border:1px solid var(--gold);background:#f4eddf;color:var(--green);padding:8px 12px;border-radius:8px;font-family:Arial,sans-serif;font-size:11px;font-weight:700
}
.segment button.active{background:var(--green);color:#fff4df}
.chart-wrap{padding:20px;height:310px}
canvas{width:100%;height:100%}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:12px}
th{background:var(--green);color:#f8efd9;padding:12px 10px;text-align:left;letter-spacing:.5px}
td{padding:11px 10px;border-bottom:1px solid #e3dac9}
tbody tr:hover{background:#f8f1e2}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:bold}
.badge.enter{background:#e1efe5;color:#286342}.badge.exit{background:#f3dfdc;color:#87382f}
.amount{text-align:center;font-weight:bold;white-space:nowrap}
.actions{white-space:nowrap;text-align:center}
.actions .icon-btn{margin:0 3px}
th.amount-head,th.actions-head{text-align:center}
.table-wrap table{table-layout:fixed}
.table-wrap th:nth-child(1),.table-wrap td:nth-child(1){width:17%}
.table-wrap th:nth-child(2),.table-wrap td:nth-child(2){width:11%;text-align:center}
.table-wrap th:nth-child(3),.table-wrap td:nth-child(3){width:14%;text-align:center}
.table-wrap th:nth-child(4),.table-wrap td:nth-child(4){width:18%;text-align:center}
.table-wrap th:nth-child(5),.table-wrap td:nth-child(5){width:25%}
.table-wrap th:nth-child(6),.table-wrap td:nth-child(6){width:15%;text-align:center}
.icon-btn{border:0;background:transparent;padding:6px;font-family:Arial,sans-serif;font-weight:bold}
.icon-btn.edit{color:#245d80}.icon-btn.delete{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:28px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:24px 26px}
.field label{display:block;font-family:Arial,sans-serif;font-size:11px;font-weight:bold;letter-spacing:.8px;color:var(--green);margin-bottom:7px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--gold);border-radius:11px;padding:13px 14px;background:#fcfaf3;color:var(--ink);outline:none;
  box-shadow:inset 0 1px 3px rgba(50,40,20,.08)
}
.field textarea{min-height:92px;resize:vertical}
.full{grid-column:1/-1}
.form-actions{padding:0 26px 26px;display:flex;justify-content:center;gap:10px}
.edit-banner{margin:0 26px 2px;padding:11px 15px;border:1px solid var(--gold);border-radius:11px;background:#eee5d4;color:var(--green);font-family:Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.7px;text-align:center}
.edit-banner span{font-weight:400;color:var(--muted);margin-left:5px}
.field input:disabled,.field select:disabled{opacity:1;cursor:not-allowed;background:#eee8db;color:#5d655f}
.primary,.secondary,.danger{
  border:1px solid var(--gold);border-radius:10px;padding:12px 24px;font-family:Arial,sans-serif;font-size:12px;font-weight:700
}
.primary{background:var(--green);color:#fff5df}.secondary{background:#eee4d2;color:var(--green)}.danger{background:var(--danger);color:#fff}
.notice{margin:0 26px 20px;padding:12px 15px;border-radius:10px;background:#f1e5cc;border:1px solid var(--gold);font-family:Arial,sans-serif;font-size:12px}
.setting-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;padding:24px 26px}
.card{border:1px solid var(--gold);border-radius:14px;padding:18px;background:rgba(255,253,247,.75)}
.card h3{margin:0 0 14px;color:var(--green);font-size:18px}
.user-list{display:grid;gap:9px}
.user-row{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid #e4dbc9;padding:10px 0;font-family:Arial,sans-serif;font-size:12px}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:25px}
.login-frame{
  width:min(520px,100%);padding:28px 26px 32px;background:rgba(249,246,237,.94);
  border:1px solid var(--gold);border-radius:22px;box-shadow:0 25px 60px rgba(40,32,20,.28);text-align:center
}
.login-frame:before{content:"";display:block;position:absolute}
.login-logo{width:145px;height:145px;max-width:100%;object-fit:contain;object-position:center;display:block;overflow:visible;filter:drop-shadow(0 7px 7px rgba(0,0,0,.2))}
.login-title{font-size:30px;letter-spacing:1.8px;color:var(--green);margin:8px 0 24px}
.login-form{text-align:left;border:1px solid var(--gold);border-radius:16px;padding:24px;background:rgba(255,253,247,.72)}
.login-form .field{margin-bottom:17px}
.password-wrap{position:relative}.password-wrap input{padding-right:50px}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--green);font-family:Arial,sans-serif}
.login-submit{width:190px;margin:12px auto 0;display:block;font-size:14px;letter-spacing:1px}
.forgot{display:block;margin-top:18px;text-align:center;color:var(--ink);font-size:13px;text-decoration:underline;cursor:pointer}
.login-error{min-height:18px;color:#9b3b32;font-family:Arial,sans-serif;font-size:11px;text-align:center;margin-top:8px}
.footer-note{text-align:center;color:#8c8374;font-family:Arial,sans-serif;font-size:10px;margin-top:18px}
@media(max-width:850px){
  .main-header{position:relative;top:auto;flex-wrap:wrap;padding:10px 14px}
  .brand{min-width:0;flex:1}.nav{width:100%;justify-content:center;margin:0}
  .stats{grid-template-columns:1fr}.setting-grid{grid-template-columns:1fr}
}
@media(max-width:620px){
  .app-shell{padding:10px 10px 28px}.main-header{border-radius:14px}
  .brand img{width:54px;height:54px}.brand-title{font-size:17px}
  .nav button{padding:9px 10px;font-size:10px}
  .page-title h1{font-size:24px}.stats,.section,.form-grid,.setting-grid{margin-left:12px;margin-right:12px;padding-left:14px;padding-right:14px}
  .stats{padding-bottom:14px}.section-head{align-items:flex-start;flex-direction:column}
  .form-grid{grid-template-columns:1fr}.full{grid-column:auto}.form-actions{padding:0 14px 20px}
  .user-row{grid-template-columns:1fr auto}.user-row select{grid-column:1/2}.user-row .save-user-btn{grid-column:2;grid-row:1}.user-row .delete-user-btn{grid-column:2;grid-row:2}
}

/* FAMILY FINANCES — emerald, antique gold & ivory visual system */
:root{
  --green:#092f25;--green2:#174a3a;--gold:#a77b35;--gold2:#e2c783;
  --cream:#f3eddd;--paper:#fffdf5;--ink:#193b31;--muted:#777260;
  --danger:#983d31;--shadow:0 18px 42px rgba(32,28,17,.20)
}
body{
  background-color:#0c2b22;
  background-image:
    radial-gradient(ellipse at 12% 12%,rgba(222,194,128,.10),transparent 28%),
    radial-gradient(ellipse at 88% 86%,rgba(222,194,128,.09),transparent 32%),
    linear-gradient(135deg,#0a2a21 0%,#173d30 48%,#09271f 100%);
  color:var(--ink)
}
body:before{inset:14px;border:2px solid #c5a15b;box-shadow:inset 0 0 0 4px #092f25,inset 0 0 0 6px rgba(226,199,131,.75);border-radius:0;z-index:0}
#appView{position:relative;z-index:1}
.app-shell{padding-top:22px}
.main-header{background:linear-gradient(135deg,#fffdf5,#f0e7d2);border:2px solid var(--gold);border-radius:4px;box-shadow:0 8px 0 rgba(8,39,30,.65),0 0 0 4px rgba(222,199,135,.24),var(--shadow)}
.brand{padding:4px 8px 4px 2px}
.brand-title{font-family:Georgia,'Times New Roman',serif;letter-spacing:1.2px}
.brand-role{color:#92702f}
.nav button{border:1px solid rgba(167,123,53,.42);border-radius:4px;background:linear-gradient(#174536,#082c22);color:#f8edcf;box-shadow:inset 0 0 0 1px rgba(226,199,131,.16)}
.nav button.active,.nav button:hover{background:linear-gradient(#245a44,#0a3024);color:#ffe9ae;border-color:#d7b76f;box-shadow:inset 0 0 0 1px #b58b43,0 4px 10px #09271f44}
.paper{background:linear-gradient(145deg,rgba(255,254,248,.98),rgba(241,234,216,.98));border:2px solid var(--gold);border-radius:5px;box-shadow:0 0 0 4px rgba(222,199,131,.2),var(--shadow)}
.paper:after{inset:7px;border:1px solid rgba(23,59,49,.22);border-radius:2px}
.page-title h1{font-family:Georgia,'Times New Roman',serif;letter-spacing:1.4px}
.stat,.section,.card{border:1px solid #b18b4d;border-radius:5px;background:linear-gradient(145deg,#fffdf7,#f4eddd);box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 5px 13px rgba(49,39,20,.07)}
.section-head{background:linear-gradient(90deg,rgba(220,199,147,.18),transparent);border-bottom:1px solid rgba(167,123,53,.45)}
.section-head h2,.card h3{font-family:Georgia,'Times New Roman',serif}
th{background:linear-gradient(90deg,#0a3025,#174938);border-bottom:2px solid #b18b4d}
td{background:rgba(255,253,247,.45)}
tbody tr:nth-child(even){background:rgba(218,202,164,.12)}
tbody tr:hover{background:#f1e5c7}
.field input,.field select,.field textarea{border:1px solid #b18b4d;border-radius:5px;background:linear-gradient(#fffef9,#f3eddf);box-shadow:inset 0 2px 4px rgba(50,40,20,.07)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(177,139,77,.22);border-color:#8b672b}
.primary,.secondary,.danger{border-radius:4px;box-shadow:0 3px 0 rgba(50,35,12,.15);transition:transform .15s ease,filter .15s ease}
.primary{background:linear-gradient(145deg,#1d5943,#062b21);color:#f8e7b7;border:2px solid #b38a43;box-shadow:inset 0 0 0 2px rgba(226,199,131,.2),0 4px 0 #09251d}
.primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
.secondary{background:linear-gradient(#fff9e9,#e9dcc0);color:var(--green);border-color:#b18b4d}
.danger{background:linear-gradient(#a94b3e,#7e2d26);border-color:#b88b4a}
.login-screen{position:relative;z-index:1;min-height:100vh;padding:38px 20px;overflow:hidden;background:
  radial-gradient(circle at 8% 90%,rgba(224,202,148,.10) 0 2px,transparent 3px),
  radial-gradient(circle at 92% 12%,rgba(224,202,148,.12) 0 2px,transparent 3px)}
.login-frame{position:relative;isolation:isolate;width:min(650px,100%);padding:36px 38px 30px;background:linear-gradient(145deg,#fffdf6 0%,#f4eddd 100%);border:2px solid #b18b4d;border-radius:5px;box-shadow:0 0 0 5px rgba(222,199,131,.22),0 0 0 9px rgba(9,47,37,.65),0 24px 55px rgba(0,0,0,.34);text-align:center}
.login-frame:before{content:"";position:absolute;inset:8px;border:1px solid rgba(9,47,37,.34);pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 100% 0%,rgba(198,173,119,.12),transparent 38%),radial-gradient(ellipse at 0% 100%,rgba(198,173,119,.12),transparent 38%)}
.login-logo{width:190px;height:190px;max-width:100%;object-fit:contain;overflow:visible;filter:drop-shadow(0 8px 5px rgba(35,27,12,.23))}
.login-title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(25px,4vw,37px);font-weight:bold;letter-spacing:1.5px;color:#0b3428;margin:10px 0 4px}
.login-tagline{font-size:12px;letter-spacing:1.6px;color:#8e6c30;font-weight:bold}
.login-divider{display:flex;align-items:center;justify-content:center;gap:12px;color:#a77b35;margin:13px auto 23px;max-width:310px;font-size:14px}
.login-divider:before,.login-divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#a77b35)}
.login-divider:after{transform:scaleX(-1)}
.login-form{position:relative;text-align:left;border:2px solid #b18b4d;border-radius:5px;padding:28px 26px 24px;background:linear-gradient(145deg,rgba(255,254,248,.98),rgba(238,231,214,.95));box-shadow:inset 0 0 0 3px rgba(255,255,255,.65),0 8px 17px rgba(54,42,20,.12)}
.login-form .field{margin-bottom:20px}
.login-form .field label{display:inline-block;background:linear-gradient(90deg,#0b3428,#174a3a);color:#f5dfaa;padding:6px 16px;margin:0 0 -1px 2px;border:1px solid #b18b4d;border-bottom:0;min-width:115px;font-family:Georgia,'Times New Roman',serif;font-size:14px;letter-spacing:1px}
.login-form .field select,.login-form .field input{min-height:54px;border:2px solid #b18b4d;border-radius:5px;background:linear-gradient(#fffef9,#eae3d4);font-family:Arial,sans-serif;font-size:16px;letter-spacing:.5px;padding:14px 16px;color:#183b30}
.login-form .password-wrap input{padding-right:54px}
.login-form .eye{font-size:19px}
.login-submit{width:230px;max-width:100%;min-height:58px;margin:24px auto 0;font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:bold;letter-spacing:2px;border-radius:5px}
.forgot{margin-top:22px;font-family:Arial,sans-serif;font-size:14px;color:#244c3d}
.login-motto{margin-top:28px;color:#77705f;font-size:15px;line-height:1.45;font-style:italic}
.login-motto em{font-weight:bold}
.footer-note{margin-top:16px;color:#9a875f;letter-spacing:.8px;font-size:9px}
@media(max-width:620px){
 .login-screen{padding:24px 15px}
 .login-frame{padding:26px 17px 22px;width:min(100%,540px)}
 .login-logo{width:145px;height:145px}
 .login-form{padding:21px 15px}
 .login-form .field select,.login-form .field input{font-size:14px;min-height:49px}
 .login-submit{min-height:53px;font-size:18px}
 body:before{inset:6px}
}


/* Login identity centered as a single vertical group */
#loginView .login-frame{ text-align:center; }
#loginView .login-logo{ display:block; margin:0 auto 10px !important; float:none !important; }
#loginView .login-title, #loginView .login-tagline, #loginView .login-divider{ text-align:center; margin-left:auto; margin-right:auto; }

/* Header navigation — minimal ivory bar with emerald active tab (reference-matched) */
.main-header{
  display:flex;align-items:center;gap:18px;flex-wrap:nowrap;
  background:rgba(250,247,238,.97);border:1px solid rgba(167,123,53,.38);
  border-radius:12px;padding:10px 18px;box-shadow:0 5px 18px rgba(18,42,32,.08);
}
.main-header .nav{
  display:flex;align-items:center;justify-content:flex-end;gap:8px;
  flex:1 1 auto;width:auto;margin-left:auto;flex-wrap:wrap;
}
.main-header .nav button,
.main-header .user-menu .logout{
  appearance:none;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;border-radius:9px;
  background:transparent;color:#193b31;box-shadow:none;
  padding:11px 16px;font-family:Arial,sans-serif;font-size:12px;
  font-weight:700;letter-spacing:.65px;white-space:nowrap;cursor:pointer;
  transition:background .16s ease,color .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.main-header .nav button.active{
  background:#123e31;color:#f8f0dc;border-color:#b18b4d;
  box-shadow:0 4px 9px rgba(15,50,38,.17),inset 0 0 0 1px rgba(255,255,255,.08);
}
.main-header .nav button:not(.active):hover,
.main-header .user-menu .logout:hover{
  background:rgba(18,62,49,.08);border-color:rgba(177,139,77,.45);color:#123e31;box-shadow:none;
}
.main-header .user-menu{display:flex;align-items:center;justify-content:center;gap:0;margin-left:0;flex:0 0 auto}
.main-header .user-menu .logout{margin:0}
@media(max-width:900px){
  .main-header{flex-wrap:wrap;gap:10px}
  .main-header .nav{width:100%;flex:1 1 100%;justify-content:center;margin:0;gap:6px}
  .main-header .user-menu{margin-left:auto}
}
@media(max-width:620px){
  .main-header .nav{width:100%;justify-content:center;gap:4px}
  .main-header .nav button,.main-header .user-menu .logout{padding:9px 11px;font-size:10px;letter-spacing:.35px}
  .main-header .user-menu{margin:0 auto}
}


/* Dashboard filter menu: compact DATE/TYPE picker; chosen control sits inline before search. */
.dashboard-filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;overflow:visible}
.filter-dropdown{position:relative;flex:0 0 auto;z-index:40}

input[type=date]::-webkit-datetime-edit-fields-wrapper{background:transparent}
</style>

<style id="emerald-gold-dropdown-hover-fix">
/* Dropdown hover matches the subtle inactive-header hover: ivory with a soft green tint.
   Focus/selection remains ivory; only pointer hover receives the hover treatment. */
select,
select:focus,
select:focus-visible {
  background: linear-gradient(180deg,#fffdf6 0%,#f0e7d5 100%) !important;
  color: #12392d !important;
  border-color: #b18b4d !important;
  box-shadow: inset 0 1px 3px rgba(50,40,20,.08) !important;
  outline: none;
}
select:hover {
  background: linear-gradient(180deg,#f2f4e9 0%,#e5eadc 100%) !important;
  color: #123e31 !important;
  border-color: rgba(177,139,77,.65) !important;
  box-shadow: inset 0 0 0 1px rgba(177,139,77,.12) !important;
}
/* Keep selected options neutral; where supported, hovered options use a soft header-like tint. */
select option,
select option:checked,
select option:focus {
  background-color: #fffaf0 !important;
  color: #12392d !important;
}
select option:hover {
  background-color: #e5eadc !important;
  color: #123e31 !important;
}
</style>

<style id="transaction-responsive-card-layout">
/* Transaction list: cards on narrow portrait phones; retain the full table in landscape. */
.tx-cards-view{display:none}
.tx-card{background:linear-gradient(145deg,#fffdf7,#f2ead8);border:1px solid #b18b4d;border-radius:7px;padding:14px 15px;margin:12px 12px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 10px rgba(49,39,20,.07);font-family:Arial,sans-serif;min-width:0}
.tx-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid rgba(167,123,53,.28)}
.tx-card-date{font-size:11px;font-weight:700;color:#766f63;overflow-wrap:anywhere}
.tx-card-amount{font-size:22px;font-weight:800;line-height:1.25;margin:12px 0;color:#174a3a;overflow-wrap:anywhere}
.tx-card-amount.exit{color:#8a5d24}
.tx-card-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;font-size:12px;padding:8px 0;border-top:1px solid rgba(167,123,53,.16)}
.tx-card-row span,.tx-card-purpose>span{font-size:10px;font-weight:700;letter-spacing:.8px;color:#82765f;flex:0 0 auto}
.tx-card-row strong{text-align:right;color:#193b31;overflow-wrap:anywhere}
.tx-card-purpose{padding:9px 0 2px;border-top:1px solid rgba(167,123,53,.16)}
.tx-card-purpose p{font-size:12px;line-height:1.5;margin:6px 0 0;color:#193b31;white-space:pre-wrap;overflow-wrap:anywhere}
.tx-card-actions{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid rgba(167,123,53,.25);margin-top:10px;padding-top:8px}
.tx-card-actions .icon-btn{padding:7px 10px;border:1px solid rgba(167,123,53,.35);border-radius:4px;background:#f7f0df}
@media screen and (max-width:620px) and (orientation:portrait){
  #dashboardTransactionTable .tx-table-view{display:none!important}
  #dashboardTransactionTable .tx-cards-view{display:block!important;padding:0 0 12px}
  #dashboardTransactionTable .tx-card{margin:10px 10px 0}
}
@media screen and (max-width:850px) and (orientation:landscape){
  #dashboardTransactionTable .tx-table-view{display:block!important}
  #dashboardTransactionTable .tx-cards-view{display:none!important}
}
</style>
\n</head>

async function callAdmin(action, payload={}){
  const {data:{session}}=await sb.auth.getSession();
  const response=await fetch(ADMIN_FN,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,...(session?{Authorization:`Bearer ${session.access_token}`}:{})},body:JSON.stringify({action,...payload})});
  const result=await response.json().catch(()=>({error:"Respons server tidak valid"}));
  if(!response.ok||result.error) throw new Error(result.error||`Permintaan gagal (${response.status})`);
  return result;
}

async function populateLoginUsers(){

  s.innerHTML=`<option value="" selected disabled>SELECT USER</option>`+defaultUsers.map(u=>`<option value="${esc(u.name.toLowerCase())}">${esc(u.name)}</option>`).join("");

async function login(e){
  e.preventDefault();
  const username=String(document.getElementById("loginUser").value||"").trim().toLowerCase();
  const pass=String(document.getElementById("loginPassword").value||"").trim();
  const err=document.getElementById("loginError"); err.textContent="";
  if(!username){alert("Silakan pilih USER terlebih dahulu.");return}
  const btn=document.querySelector(".login-submit"); if(btn){btn.disabled=true;btn.textContent="CONNECTING..."}
  try{
    // Fast path: sign in directly. Bootstrap is attempted only when initial accounts are not provisioned yet.
    let signIn=await sb.auth.signInWithPassword({email:`${username}@family.local`,password:pass});
    if(signIn.error && (signIn.error.code==="invalid_credentials" || /invalid login credentials|user not found/i.test(signIn.error.message||""))){
      await callAdmin("bootstrap");
      signIn=await sb.auth.signInWithPassword({email:`${username}@family.local`,password:pass});
    }
    const {data,error}=signIn;
    if(error)throw error;
    const authUser=data.user;
    const {data:member,error:memberErr}=await sb.from("group_members").select("user_id,display_name,role,username,group_id").eq("group_id",FAMILY_GROUP_ID).eq("user_id",authUser.id).single();
    if(memberErr||!member)throw new Error("Akun belum terdaftar pada FAMILY FINANCES.");
    const {data:txs,error:txErr}=await sb.from("transactions").select("id,user_id,amount,type,purpose,transaction_date,created_at").eq("group_id",FAMILY_GROUP_ID).order("transaction_date",{ascending:false});
    if(txErr)throw txErr;

    currentUser={id:member.user_id,name:member.display_name,role:member.role,username:member.username};
    document.getElementById("loginPassword").value="";
    document.getElementById("loginView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");currentPage="dashboard";render();startRealtime();
  }catch(ex){console.error(ex);alert(ex.message||"Login gagal. Periksa koneksi dan password.");}

}

function filteredDashboardTransactions(){
  return [...state.transactions].filter(t=>{
    const date=String(t.date||"");
    if(dashboardDateMode==="Monthly"){
      if(dashboardYear&&date.slice(0,4)!==String(dashboardYear))return false;
      if(dashboardMonth&&date.slice(5,7)!==dashboardMonth)return false;
    }else if(dashboardDateMode==="Daily"){
      if(dashboardDaily&&date!==dashboardDaily)return false;
    }else{
      if(dashboardFrom&&date<dashboardFrom)return false;
      if(dashboardTo&&date>dashboardTo)return false;
    }
    if(dashboardType&&t.type!==dashboardType)return false;
    const query=String(dashboardSearch||"").trim().toLocaleLowerCase("id-ID");
    if(query){
      const haystack=[t.user,t.type,t.purpose,t.date,dateLabel(t.date),money(t.amount)].join(" ").toLocaleLowerCase("id-ID");
      if(!haystack.includes(query))return false;
    }
    return true;
  }).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));

function chartPeriodLabel(k){
  if(chartMode==="day")return k.slice(8,10)+"/"+k.slice(5,7)+"/"+k.slice(0,4);
  if(chartMode==="month"){const [y,m]=k.split("-");return new Date(Number(y),Number(m)-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"});}
  return "Tahun "+k;
}
function chartKeyForTransaction(t){
  if(chartMode==="day")return t.date;
  if(chartMode==="month")return String(t.date||"").slice(0,7);
  return String(t.date||"").slice(0,4);
}
function showChartTooltip(index,clientX,clientY){
  const canvas=document.getElementById("expenseChart"),tip=document.getElementById("expenseChartTooltip");
  if(!canvas||!tip||!chartPoints[index])return;
  chartSelectedIndex=index;
  const point=chartPoints[index];
  const records=state.transactions.filter(t=>t.type==="EXIT"&&chartKeyForTransaction(t)===point.key).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  tip.innerHTML=`<strong>${esc(chartPeriodLabel(point.key))}</strong><div class="chart-tooltip-total">Total EXIT: ${money(point.value)}</div>`+
    (records.length?records.slice(0,7).map(t=>`<div class="chart-detail"><b>${money(t.amount)}</b> · ${esc(t.user||"-")}<br><small>${esc(dateLabel(t.date))}${t.time?" · "+esc(t.time):""} — ${esc(t.purpose||"-")}</small></div>`).join(""):`<small>Tidak ada transaksi EXIT pada periode ini.</small>`)+
    (records.length>7?`<small>+ ${records.length-7} transaksi lainnya</small>`:"");
  const wrap=canvas.parentElement,wr=wrap.getBoundingClientRect(),cr=canvas.getBoundingClientRect();
  let x=(clientX!=null?clientX-cr.left:point.x),y=(clientY!=null?clientY-cr.top:point.y);
  tip.style.left=Math.max(5,Math.min(wr.width-tip.offsetWidth-5,x+14))+'px';
  tip.style.top=Math.max(5,Math.min(wr.height-tip.offsetHeight-5,y+10))+'px';
  tip.classList.add("visible");
}
function drawChart(){
  const canvas=document.getElementById("expenseChart");if(!canvas)return;
  const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;
  const dpr=window.devicePixelRatio||1;
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  const c=canvas.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
  const w=rect.width,h=rect.height,p={l:58,r:18,t:18,b:38};
  c.clearRect(0,0,w,h);
  const groups={};
  state.transactions.filter(t=>t.type==="EXIT"&&t.date).forEach(t=>{const k=chartKeyForTransaction(t);groups[k]=(groups[k]||0)+Number(t.amount||0)});
  let labels=Object.keys(groups).sort();
  if(chartMode==="day")labels=labels.slice(-14);else if(chartMode==="month")labels=labels.slice(-12);else labels=labels.slice(-8);
  const values=labels.map(k=>groups[k]||0),max=Math.max(...values,1),plotW=w-p.l-p.r,plotH=h-p.t-p.b;
  c.strokeStyle="rgba(167,123,53,.20)";c.lineWidth=1;
  c.fillStyle="#766f63";c.font="10px Arial";c.textAlign="right";
  for(let i=0;i<5;i++){const y=p.t+plotH*i/4;c.beginPath();c.moveTo(p.l,y);c.lineTo(w-p.r,y);c.stroke();c.fillText(money(max*(1-i/4)).replace(",00",""),p.l-6,y+3)}
  chartPoints=[];
  if(!labels.length){c.fillStyle="#766f63";c.font="13px Arial";c.textAlign="center";c.fillText("Belum ada data EXIT untuk ditampilkan.",w/2,h/2);const tip=document.getElementById("expenseChartTooltip");if(tip)tip.classList.remove("visible");return;}
  const slot=plotW/labels.length,barW=Math.max(8,Math.min(34,slot*.52));
  labels.forEach((k,i)=>{
    const x=p.l+slot*i+slot/2,y=p.t+plotH-(values[i]/max)*plotH;
    chartPoints.push({key:k,value:values[i],x,y,barX:x-barW/2,barW,baseY:p.t+plotH});
    const grad=c.createLinearGradient(0,y,0,p.t+plotH);grad.addColorStop(0,"#b88d43");grad.addColorStop(1,"#e4cf9d");
    c.fillStyle=grad;c.fillRect(x-barW/2,y,barW,Math.max(1,p.t+plotH-y));
  });
  // Line series overlays the bars to emphasize the trend.
  c.strokeStyle="#0d4937";c.lineWidth=2.8;c.lineJoin="round";c.lineCap="round";c.beginPath();
  chartPoints.forEach((pt,i)=>i?c.lineTo(pt.x,pt.y):c.moveTo(pt.x,pt.y));c.stroke();
  chartPoints.forEach((pt,i)=>{
    c.fillStyle="#fff8e8";c.strokeStyle="#0d4937";c.lineWidth=2;c.beginPath();c.arc(pt.x,pt.y,4,0,Math.PI*2);c.fill();c.stroke();
    c.fillStyle="#766f63";c.font="10px Arial";c.textAlign="center";
    let lab=chartMode==="day"?pt.key.slice(8,10)+"/"+pt.key.slice(5,7):chartMode==="month"?pt.key.slice(5,7)+"/"+pt.key.slice(0,4):pt.key;
    c.fillText(lab,pt.x,h-12);
  });
  if(chartSelectedIndex>=0&&chartPoints[chartSelectedIndex])showChartTooltip(chartSelectedIndex);
  // Tooltip interaction is limited to the actual visible bar area.
  // Do not select the nearest data point when the pointer is elsewhere in the chart.
  const hitTest=e=>{
    const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    for(let i=0;i<chartPoints.length;i++){
      const pt=chartPoints[i];
      const top=Math.min(pt.y,pt.baseY);
      const bottom=Math.max(pt.y,pt.baseY);
      if(x>=pt.barX && x<=pt.barX+pt.barW && y>=top && y<=bottom){
        showChartTooltip(i,e.clientX,e.clientY);
        return i;
      }
    }
    return -1;
  };
  canvas.onmousemove=e=>{const i=hitTest(e);if(i<0){const tip=document.getElementById("expenseChartTooltip");if(tip)tip.classList.remove("visible");chartSelectedIndex=-1;}};
  canvas.onclick=e=>{const i=hitTest(e);if(i>=0){chartSelectedIndex=i;showChartTooltip(i,e.clientX,e.clientY);}};
  canvas.onmouseleave=()=>{if(chartSelectedIndex<0){const tip=document.getElementById("expenseChartTooltip");if(tip)tip.classList.remove("visible");}};
}

function saveTx(e){
  e.preventDefault();
  const amount=parseAmount(document.getElementById("txAmount").value);
  const selectedUser=editingId
    ? (document.getElementById("txUser").value||currentUser?.name||"")
    : (currentUser?.name||"");
  const item={user:selectedUser,type:document.getElementById("txType").value,date:document.getElementById("txDate").value,purpose:document.getElementById("txPurpose").value.trim().toLocaleUpperCase("id-ID"),amount};
  if(!amount||!item.user||!item.type||!item.purpose){alert("Lengkapi semua data transaksi.");return}
  // Hitung saldo setelah transaksi (untuk edit, keluarkan dulu transaksi lama).
  const existing=editingId?state.transactions.find(t=>t.id===editingId):null;
  let projectedBalance=totals().balance;
  if(existing) projectedBalance += existing.type==="ENTER" ? -existing.amount : existing.amount;
  projectedBalance += item.type==="ENTER" ? amount : -amount;
  if(projectedBalance<0){
    alert("Total keuangan keluarga tidak cukup.");
    return;
  }
  const submitBtn=document.querySelector('#txForm button[type="submit"]');if(submitBtn){submitBtn.disabled=true;submitBtn.textContent="SAVING..."}
  (async()=>{try{
    const dbItem={group_id:FAMILY_GROUP_ID,user_id:currentUser.id,amount,type:item.type,purpose:item.purpose,transaction_date:item.date};
    let result;
    if(editingId)result=await sb.from("transactions").update(dbItem).eq("id",editingId).eq("group_id",FAMILY_GROUP_ID);
    else result=await sb.from("transactions").insert(dbItem);
    if(result.error)throw result.error;
    editingId=null;await refreshTransactions();alert("TRANSAKSI BERHASIL DISIMPAN");go("dashboard");
  }catch(ex){console.error(ex);alert(ex.message||"Gagal menyimpan transaksi ke Supabase.");}
  finally{if(submitBtn){submitBtn.disabled=false;submitBtn.textContent=editingId?"UPDATE TRANSACTION":"SAVE TRANSACTION"}}})();
}
function editTx(id){if(!canEdit()){alert("Akses edit hanya untuk ADMIN.");return}editingId=id;currentPage="cashflow";render()}
async function deleteTx(id){
  if(!canEdit())return;
  const t=state.transactions.find(x=>x.id===id);
  if(!t)return;
  if(await confirm(`Hapus transaksi ${money(t.amount)} - ${t.purpose}?`)){const {error}=await sb.from("transactions").delete().eq("id",id).eq("group_id",FAMILY_GROUP_ID);if(error){alert(error.message);return}await refreshTransactions()}
}

async function updateUser(id){
  const u=state.users.find(x=>x.id===id);if(!u)return;
  const oldName=u.name;const name=document.getElementById("name_"+id).value.trim().toUpperCase();
  const role=document.getElementById("role_"+id).value;
  if(!name){alert("Nama user tidak boleh kosong.");return}
  if(state.users.some(x=>x.id!==id&&x.name===name)){alert("Nama user sudah digunakan.");return}
  try{await callAdmin("update_user",{user_id:id,name,role});await populateLoginUsers();remoteUsers=(await callAdmin("list_users")).users||[];state.users=remoteUsers.map(x=>({id:x.user_id,name:x.display_name,role:x.role,username:x.username}));if(currentUser.id===id)currentUser={...currentUser,name,role};await refreshTransactions();render();alert("USER & ROLE berhasil diperbarui.")}catch(ex){alert(ex.message||"Gagal memperbarui user") }
}
async function deleteUser(id){
  if(currentRole()!=="ADMIN"){alert("Hanya ADMIN yang dapat menghapus user.");return}
  const u=state.users.find(x=>x.id===id);if(!u)return;
  if(currentUser&&currentUser.id===id){alert("User yang sedang login tidak dapat dihapus.");return}
  if(u.role==="ADMIN" && state.users.filter(x=>x.role==="ADMIN").length<=1){alert("ADMIN terakhir tidak dapat dihapus.");return}
  const hasTransactions=state.transactions.some(t=>t.user===u.name);
  const msg=hasTransactions
    ? `Hapus user ${u.name}? Riwayat transaksi atas nama user ini tetap dipertahankan.`
    : `Hapus user ${u.name}?`;
  if(!await confirm(msg))return;
  try{await callAdmin("delete_user",{user_id:id});remoteUsers=(await callAdmin("list_users")).users||[];state.users=remoteUsers.map(x=>({id:x.user_id,name:x.display_name,role:x.role,username:x.username}));render();await populateLoginUsers()}catch(ex){alert(ex.message||"Gagal menghapus user")}
}
async function addUser(){
  const name=await prompt("Nama user baru:");if(!name)return;
  const clean=name.trim().toUpperCase();
  if(state.users.some(u=>u.name===clean)){alert("Nama user sudah ada.");return}
  const role=await prompt("Role (ADMIN / SEKRETARIS / MEMBER):","MEMBER");
  if(!["ADMIN","SEKRETARIS","MEMBER"].includes(String(role).trim().toUpperCase())){alert("Role tidak valid.");return}
  const password=await prompt("Password awal:","KELUARGA");if(password===null)return;if(password.length<4){alert("Password minimal 4 karakter.");return;}
  try{await callAdmin("create_user",{name:clean,role:String(role).trim().toUpperCase(),username:clean.toLowerCase().replace(/\s+/g,"."),password:password||"KELUARGA"});remoteUsers=(await callAdmin("list_users")).users||[];state.users=remoteUsers.map(x=>({id:x.user_id,name:x.display_name,role:x.role,username:x.username}));render();await populateLoginUsers()}catch(ex){alert(ex.message||"Gagal menambahkan user")}
}
function toggleNewPassword(){
  const input=document.getElementById("newPass");
  const btn=document.querySelector(".password-toggle-btn");
  if(!input)return;
  const show=input.type==="password";
  input.type=show?"text":"password";
  if(btn){btn.setAttribute("aria-label",show?"Sembunyikan password":"Tampilkan password");btn.setAttribute("title",show?"Sembunyikan password":"Tampilkan password");}
}
async function changePassword(){
  const id=document.getElementById("passUser").value;const pass=document.getElementById("newPass").value;
  if(pass.length<4){alert("Password baru minimal 4 karakter.");return}
  const u=state.users.find(x=>x.id===id);if(!u)return;
  try{await callAdmin("set_password",{user_id:id,password:pass});document.getElementById("newPass").value="";alert(`Password ${u.name} berhasil diubah.`)}catch(ex){alert(ex.message||"Gagal mengubah password")}
}


// Custom centered dialog system, styled to match the FAMILY FINANCES theme.
let ffDialogResolver=null, ffDialogTimer=null;
function ffCloseDialog(value){
  const backdrop=document.getElementById('ffDialogBackdrop');
  if(!backdrop||!backdrop.classList.contains('show'))return;
  backdrop.classList.remove('show');
  if(ffDialogTimer){clearTimeout(ffDialogTimer);ffDialogTimer=null;}
  const resolve=ffDialogResolver;ffDialogResolver=null;
  if(resolve)resolve(value);
}
function ffShowDialog({kind='alert',message='',defaultValue='',title='',type='info'}={}){
  const backdrop=document.getElementById('ffDialogBackdrop');
  const titleEl=document.getElementById('ffDialogTitle');
  const msgEl=document.getElementById('ffDialogMessage');
  const input=document.getElementById('ffDialogInput');
  const actions=document.getElementById('ffDialogActions');
  const emblem=document.getElementById('ffDialogEmblem');
  if(!backdrop)return Promise.resolve(kind==='confirm'?false:null);
  if(ffDialogResolver)ffCloseDialog(kind==='confirm'?false:null);
  if(ffDialogTimer){clearTimeout(ffDialogTimer);ffDialogTimer=null;}
  const text=String(message??'');
  let inferred=type;
  if(/gagal|tidak cukup|tidak valid|tidak boleh|tidak dapat|tidak bisa|kosong|sudah digunakan|sudah ada|lengkapi/i.test(text))inferred='error';
  else if(/berhasil|disimpan|diperbarui|diubah/i.test(text))inferred='success';
  else if(kind==='confirm')inferred='warning';
  titleEl.textContent=title||(kind==='confirm'?'KONFIRMASI':kind==='prompt'?'INPUT DATA':inferred==='success'?'BERHASIL':inferred==='error'?'TRANSAKSI GAGAL':inferred==='warning'?'PERHATIAN':'FAMILY FINANCES');
  emblem.textContent=inferred==='success'?'✓':inferred==='error'?'!':inferred==='warning'?'◆':'✦';
  msgEl.textContent=text;
  input.style.display=kind==='prompt'?'block':'none';input.type='text';input.value=String(defaultValue??'');input.placeholder='Masukkan data';
  actions.innerHTML='';
  return new Promise(resolve=>{
    ffDialogResolver=resolve;
    const addBtn=(label,value,cls='')=>{const b=document.createElement('button');b.type='button';b.className='ff-dialog-btn '+cls;b.textContent=label;b.addEventListener('click',()=>ffCloseDialog(value));actions.appendChild(b);return b;};
    if(kind==='confirm'){
      addBtn('BATAL',false,'secondary');addBtn('LANJUTKAN',true,'danger');
    }else if(kind==='prompt'){
      addBtn('BATAL',null,'secondary');const ok=document.createElement('button');ok.type='button';ok.className='ff-dialog-btn';ok.textContent='SIMPAN';ok.addEventListener('click',()=>ffCloseDialog(input.value));actions.appendChild(ok);
      input.addEventListener('keydown',function onKey(e){if(e.key==='Enter'){e.preventDefault();input.removeEventListener('keydown',onKey);ffCloseDialog(input.value)}});
    }else{
      addBtn('OK',true);
    }
    backdrop.classList.add('show');
    if(kind==='prompt'){setTimeout(()=>input.focus(),40)}
    else if(kind==='alert')ffDialogTimer=setTimeout(()=>ffCloseDialog(true),3800);
  });
}
function alert(message){ffShowDialog({kind:'alert',message});}
function confirm(message){return ffShowDialog({kind:'confirm',message});}
function prompt(message,defaultValue=''){return ffShowDialog({kind:'prompt',message,defaultValue});}

init();

    <input id="ffDialogInput" class="ff-dialog-input" style="display:none" autocomplete="off">
